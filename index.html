<title>INDUPROX · Acceso clientes</title>
<style>
:root { --bg:#EDF0F2; --ink:#14202B; --muted:#586976; --line:#D3DAE0; --accent:#B3261E; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; line-height: 1.45; padding: 0 16px; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 20px 0 56px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 26px; }
.logo { font-weight: 800; font-size: 24px; letter-spacing: .06em; }
.logo small { display: block; font-weight: 500; font-size: 12px; letter-spacing: .02em; color: var(--muted); }
.logo .back { display: inline-block; margin-top: 4px; font-weight: 600; font-size: 13px; letter-spacing: 0; color: var(--accent); text-decoration: none; }
.logo .back:hover { text-decoration: underline; }
.link { background: none; border: 0; color: var(--accent); font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: underline; padding: 6px; }
h1 { margin: 0 0 6px; font-size: 28px; line-height: 1.15; }
.hint { color: var(--muted); margin: 0 0 22px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
.card { position: relative; display: flex; flex-direction: column; min-height: 300px; padding: 22px 20px 18px; border-radius: 16px; color: #fff; text-decoration: none; overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.18); }
.card .no { font-size: 13px; opacity: .85; margin-bottom: 14px; }
.card h2 { margin: 0 0 12px; font-size: 24px; line-height: 1.12; }
.card p { margin: 0; font-size: 14px; line-height: 1.5; opacity: .95; flex: 1; }
.card .go { margin-top: 16px; text-align: center; font-weight: 700; font-size: 15px; }
.c1, .c2, .c3, .c4 { background-size: cover; background-position: center; background-color: #1d2126; }
.c1 { background-image: linear-gradient(rgba(160,28,21,.65), rgba(160,28,21,.65)), url(bg/incendios.webp); }
.c2 { background-image: linear-gradient(rgba(12,80,180,.65), rgba(12,80,180,.65)), url(bg/proteccion.webp); }
.c3 { background-image: linear-gradient(rgba(26,42,60,.65), rgba(26,42,60,.65)), url(bg/suministro.webp); }
.c4 { background-image: linear-gradient(rgba(12,24,40,.62), rgba(12,24,40,.62)), url(bg/vial.webp); }
.s1 { background-image: linear-gradient(rgba(26,42,60,.62), rgba(26,42,60,.62)), url(bg/sum_pernos.webp); }
.s2 { background-image: linear-gradient(rgba(26,42,60,.62), rgba(26,42,60,.62)), url(bg/sum_manuales.webp); }
.s3 { background-image: linear-gradient(rgba(26,42,60,.62), rgba(26,42,60,.62)), url(bg/sum_electricas.webp); }
.c4 h2, .c4 .no { color: #f2c200; }
.c4 .go { color: #f2c200; }
a.card:hover { transform: translateY(-2px); }
.card.off { filter: grayscale(.55) brightness(.95); opacity: .78; cursor: default; }
.card.off .go { font-weight: 600; }
.login { max-width: 340px; margin: 60px auto 0; background: #fff; border: 1px solid #d8dce1; border-radius: 12px; padding: 28px 24px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
.login h1 { font-size: 22px; }
.login label { display: block; margin-bottom: 12px; }
.login input { display: block; width: 100%; margin-top: 4px; padding: 10px; font-size: 16px; border: 1px solid #b8c0c8; border-radius: 8px; }
.login button[type=submit] { width: 100%; padding: 11px; font-size: 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
.login button:disabled { opacity: .6; }
#err { min-height: 20px; color: #b3261e; margin-bottom: 8px; }
.alerts { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 12px; }
.bdg { font: 700 12px system-ui, sans-serif; padding: 4px 10px; border-radius: 999px; border: 0; cursor: pointer; }
.bdg.f { background: #FCEBEB; color: #791F1F; }
.bdg.p { background: #FAEEDA; color: #633806; }
.panel { margin-top: 28px; background: #fff; border: 1px solid #d8dce1; border-radius: 12px; padding: 18px 18px 10px; }
.panel h2 { margin: 0; font-size: 20px; }
.panel .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.panel .sc { overflow-x: auto; }
table.ped { width: 100%; border-collapse: collapse; font-size: 14px; }
table.ped th { text-align: left; font-weight: 600; color: var(--muted); padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.ped td { padding: 8px; border-bottom: 1px solid #eef1f3; white-space: nowrap; }
table.ped td.n { text-align: right; }
.est { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
.est.f { background: #FCEBEB; color: #791F1F; }
.est.p { background: #FAEEDA; color: #633806; }
.pmsg { color: var(--muted); padding: 8px 0; }
tr.prow { cursor: pointer; }
tr.prow:hover td, tr.prow.open td { background: #F6F8F9; }
tr.pdet > td { white-space: normal; background: #F6F8F9; padding: 4px 8px 14px; }
.pbox { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.pinfo { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-bottom: 10px; font-size: 14px; }
.pinfo .pnote { flex-basis: 100%; }
table.pit { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.pit th { text-align: left; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.pit td { padding: 6px 8px; border-bottom: 1px solid #eef1f3; white-space: normal; }
table.pit .n { text-align: right; white-space: nowrap; }
table.pit tfoot td { font-weight: 700; border-bottom: 0; }

    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, ak, buf.slice(12));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  function clearSession() {
    try {
      localStorage.removeItem(SESSION_KEY); localStorage.removeItem('ord-auth'); localStorage.removeItem('ped-auth'); localStorage.removeItem('psg-auth'); localStorage.removeItem('via-auth'); localStorage.removeItem('hma-auth'); localStorage.removeItem('hel-auth');
      Object.keys(localStorage).forEach(function (k) { if (k.indexOf('inx-ck:') === 0) localStorage.removeItem(k); });
    } catch (e) { }
  }
  function startSession(mf, n, khex) {
    try {
      localStorage.setItem(SESSION_KEY, JSON.stringify({ n: n, k: khex, t: Date.now() }));
      Object.keys(mf.cks).forEach(function (d) { localStorage.setItem('inx-ck:' + d, mf.cks[d]); });
      Object.keys(mf.auths || {}).forEach(function (k) { localStorage.setItem(k, mf.auths[k]); });
    } catch (e) { }
    var g = /#go=(\w+)/.exec(location.hash);          // viene de una página de pedidos que necesitaba renovar su llave
    if (g && mf.cks[g[1]]) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { } location.replace(g[1] + '/'); return; }
    showAreas(mf);
  }
  // Suministro industrial se divide en líneas; el acceso a cada una depende del cliente
  var SUBS = [
    { k: 'industrial', t: 'Pernos, sujeción y brocas', d: 'Pernos, tuercas, golillas, anclajes y demás elementos de fijación.' },
    { k: 'herr_manuales', t: 'Herramientas manuales', d: 'Llaves y dados, alicates, destornilladores, martillos, brocas y herramientas de pintura.' },
    { k: 'herr_electricas', t: 'Herramientas eléctricas', d: 'Esmeriles angulares, taladros, rectificadores, tronzadoras y sus accesorios.' }
  ];
  // Equipos contra incendios: catálogo genérico INDUPROX y catálogo propio de KUPFER (solo quien tiene ambos ve la página intermedia)
  var INC = [
    { k: 'incendios', t: 'Catálogo INDUPROX', d: 'Extintores, carros, mangueras, gabinetes y accesorios, con SKU INDUPROX.' },
    { k: 'incendios_kupfer', t: 'Catálogo KUPFER', d: 'Página de KUPFER: sus códigos y fotos de producto.' }
  ];
  var CUR = null;
  window.addEventListener('hashchange', function () { if (CUR) showAreas(CUR); });
  function showSub(mf, L, tit, pre, cls) {
    L = L || SUBS; tit = tit || 'Suministro industrial'; pre = pre || '03.'; cls = cls || 'c3 s';
    var cards = L.map(function (s, i) {
      var url = mf.areas[s.k];
      var inner = '<span class="no">' + pre + (i + 1) + '</span><h2>' + esc(s.t) + '</h2><p>' + esc(s.d) + '</p>' + (url ? '<span class="go">Ver línea →</span>' : mf.todas ? '<span class="go">En preparación</span>' : '<a class="go" href="https://www.induprox.com/contacto/" style="color:inherit">Solicitar acceso</a>');
      var cl = cls + (cls === 'c3 s' ? (i + 1) : '');
      return url ? '<a class="card ' + cl + '" href="' + esc(url) + '">' + inner + '</a>' : '<div class="card off ' + cl + '" aria-disabled="true">' + inner + '</div>';
    }).join('');
    app.innerHTML = '<p style="margin:0 0 12px"><a href="#" style="color:var(--accent);font-weight:600;text-decoration:none">← Volver a las áreas</a></p>' +
      '<h1>' + esc(tit) + '</h1><p class="hint">Elija la línea con la que desea trabajar.</p><div class="cards">' + cards + '</div>';
  }
  function showAreas(mf) {
    CUR = mf;
    logout.hidden = false;
    who.textContent = 'Acceso clientes · ' + (mf.name || ''); who.hidden = !mf.name;
    if (location.hash === '#suministro') { showSub(mf); return; }
    if (location.hash === '#incendios') { showSub(mf, INC, 'Equipos contra incendios', '01.', 'c1'); return; }
    var cards = AREAS.map(function (a) {
      var url = a.k === 'industrial' ? (SUBS.some(function (s) { return mf.areas[s.k]; }) ? '#suministro' : '') :
        a.k === 'incendios' && mf.areas.incendios && mf.areas.incendios_kupfer ? '#incendios' : mf.areas[a.k];
      var inner = '<span class="no">' + a.no + '</span><h2>' + esc(a.t) + '</h2>' + (mf.panel ? '<div class="alerts" data-a="' + a.k + '"></div>' : '') + '<p>' + esc(a.d) + '</p>' + (url ? '<span class="go">Ver línea →</span>' : mf.todas ? '<span class="go">En preparación</span>' : '<a class="go" href="https://www.induprox.com/contacto/" style="color:inherit">Solicitar acceso</a>');
      if (url) return '<a class="card ' + a.c + '" href="' + esc(url) + '">' + inner + '</a>';
      return mf.todas ? '<div class="card ' + a.c + '" style="cursor:default">' + inner + '</div>' : '<div class="card off ' + a.c + '" aria-disabled="true">' + inner + '</div>';
    }).join('');
    app.innerHTML = '<h1>Elija el área con la que desea trabajar</h1><p class="hint">Seleccione una línea para preparar su pedido.</p><div class="cards">' + cards + '</div>' +
      (mf.panel ? '<section class="panel" id="panel"><div class="top"><h2>Pedidos de clientes</h2><span id="pfil"></span><button class="link" id="prel" style="margin-left:auto">Actualizar</button></div><div id="pbody"><p class="pmsg">Cargando pedidos…</p></div></section>' : '');
    if (mf.panel) loadPanel(mf.panel);
  }

  // ---- panel de pedidos (solo usuarios con "panel" en su manifiesto) ----
  var PED = [], PERR = [], PFIL = '';
  function areaName(k) { for (var i = 0; i < AREAS.length; i++) if (AREAS[i].k === k) return AREAS[i].t; return k; }
  function fecha(s) {
    var d = new Date(s); if (isNaN(d.getTime())) return '';
    var p = function (n) { return ('0' + n).slice(-2); };
    return p(d.getDate()) + '-' + p(d.getMonth() + 1) + '-' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  async function loadPanel(panel) {
    document.getElementById('prel').onclick = function () { loadPanel(panel); };
    document.getElementById('pbody').innerHTML = '<p class="pmsg">Cargando pedidos…</p>';
    var ped = [], perr = [];
    await Promise.all(panel.map(async function (src) {
      try {
        var r = await fetch(src.e, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'list', token: src.t }) });
        var j = await r.json();
        if (!j || !j.ok) throw new Error((j && j.error) || 'error');
        (j.orders || []).forEach(function (o) { if (src.p && String(o.id).indexOf(src.p) !== 0) return; ped.push({ a: src.a, c: src.c, id: o.id, u: o.updated, n: o.lines, s: o.status === 'Sent' ? 'f' : 'p', e: src.e, t: src.t }); });
      } catch (e) { perr.push(src.c); }
    }));
    ped.sort(function (x, y) { return x.s === y.s ? (String(y.u) < String(x.u) ? -1 : String(y.u) > String(x.u) ? 1 : 0) : (x.s === 'f' ? -1 : 1); });
    PED = ped; PERR = perr;
    if (!document.getElementById('panel')) return;
    drawAlerts(); drawTable();
  }
  function drawAlerts() {
    Array.prototype.forEach.call(document.querySelectorAll('.alerts'), function (box) {
      var k = box.getAttribute('data-a'), f = 0, p = 0;
      PED.forEach(function (o) { if (o.a === k) { if (o.s === 'f') f++; else p++; } });
      box.innerHTML = (f ? '<button class="bdg f" data-a="' + k + '">' + f + (f === 1 ? ' firme' : ' firmes') + '</button>' : '') +
                      (p ? '<button class="bdg p" data-a="' + k + '">' + p + ' en proceso</button>' : '');
    });
  }
  function drawTable() {
    var rows = PED.filter(function (o) { return !PFIL || o.a === PFIL; });
    document.getElementById('pfil').innerHTML = PFIL ? 'Mostrando: ' + esc(areaName(PFIL)) + ' · <button class="link" id="pall" style="padding:0">Ver todos</button>' : '';
    var h = PERR.length ? '<p class="pmsg">No se pudieron leer los pedidos de ' + esc(PERR.join(' y ')) + '.</p>' : '';
    h += rows.length ? '<div class="sc"><table class="ped"><thead><tr><th>Estado</th><th>Cliente</th><th>Área</th><th>Pedido</th><th>Fecha</th><th>Líneas</th></tr></thead><tbody>' +
      rows.map(function (o) {
        return '<tr class="prow" data-i="' + PED.indexOf(o) + '" title="Ver resumen del pedido"><td><span class="est ' + o.s + '">' + (o.s === 'f' ? 'Firme' : 'En proceso') + '</span></td><td>' + esc(o.c) + '</td><td>' + esc(areaName(o.a)) +
               '</td><td>' + esc(o.id) + '</td><td>' + esc(fecha(o.u)) + '</td><td class="n">' + esc(o.n) + '</td></tr>';
      }).join('') + '</tbody></table></div>' : (PERR.length ? '' : '<p class="pmsg">No hay pedidos.</p>');
    document.getElementById('pbody').innerHTML = h;
  }
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest && ev.target.closest('.bdg');
    if (b) { ev.preventDefault(); ev.stopPropagation(); PFIL = b.getAttribute('data-a'); drawTable(); document.getElementById('panel').scrollIntoView({ behavior: 'smooth' }); return; }
    if (ev.target.id === 'pall') { PFIL = ''; drawTable(); }
    var tr = ev.target.closest && ev.target.closest('tr.prow');
    if (tr) toggleDetail(tr);
  });
  // resumen simple del pedido (comprador, observaciones y productos), abierto debajo de la fila
  async function toggleDetail(tr) {
    var nx = tr.nextElementSibling;
    if (nx && nx.classList.contains('pdet')) { nx.remove(); tr.classList.remove('open'); return; }
    var o = PED[+tr.getAttribute('data-i')]; if (!o) return;
    tr.classList.add('open');
    var det = document.createElement('tr'); det.className = 'pdet';
    det.innerHTML = '<td colspan="6"><div class="pbox"><p class="pmsg">Cargando resumen…</p></div></td>';
    tr.parentNode.insertBefore(det, tr.nextSibling);
    var box = det.querySelector('.pbox');
    try {
      var r = await fetch(o.e, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'get', token: o.t, id: o.id }) });
      var j = await r.json();
      if (!j || !j.ok || !j.order) throw new Error((j && j.error) || 'error');
      var d = j.order, tot = 0;
      d.items.forEach(function (it) { tot += Number(it.q) || 0; });
      box.innerHTML = '<div class="pinfo"><div><b>Comprador:</b> ' + esc(d.client || '—') + '</div><div><b>Cliente:</b> ' + esc(o.c) + '</div><div><b>Fecha:</b> ' + esc(fecha(d.updated)) + '</div>' +
        '<div><b>Estado:</b> ' + (d.status === 'Sent' ? 'Firme' : 'En proceso') + '</div>' + (d.note ? '<div class="pnote"><b>Observaciones:</b> ' + esc(d.note) + '</div>' : '') + '</div>' +
        (d.items.length ? '<table class="pit"><thead><tr><th>SKU</th><th>Producto</th><th class="n">Cantidad</th></tr></thead><tbody>' +
          d.items.map(function (it) { return '<tr><td>' + esc(it.t) + '</td><td>' + esc(it.n) + '</td><td class="n">' + esc(Number(it.q).toLocaleString('es-CL')) + ' ' + esc(it.u || '') + '</td></tr>'; }).join('') +
          '</tbody><tfoot><tr><td colspan="2">Total: ' + d.items.length + (d.items.length === 1 ? ' línea' : ' líneas') + '</td><td class="n">' + esc(tot.toLocaleString('es-CL')) + ' unidades</td></tr></tfoot></table>' : '<p class="pmsg">El pedido no tiene productos.</p>');
    } catch (e) {
      box.innerHTML = '<p class="pmsg">No se pudo leer el detalle de este pedido. Si persiste, la hoja de ' + esc(o.c) + ' necesita la versión nueva de su programa.</p>';
    }
  }
  function showLogin() {
    logout.hidden = true; who.hidden = true;
    app.innerHTML = '<form class="login" id="lf"><h1>Acceso clientes</h1><p class="hint" style="margin-bottom:18px">Ingrese con su usuario y contraseña</p>' +
      '<label>Usuario<input id="lgUser" autocomplete="username" autocapitalize="none" required></label>' +
      '<label>Contraseña<input id="lgPass" type="password" autocomplete="current-password" required></label>' +
      '<div id="err" role="alert"></div><button type="submit">Ingresar</button></form>';
    var err = document.getElementById('err');
    if (!(window.crypto && crypto.subtle)) { err.textContent = 'Este navegador no puede abrir la página de forma segura. Use un navegador actual.'; return; }
    document.getElementById('lgUser').focus();
    document.getElementById('lf').addEventListener('submit', async function (ev) {
      ev.preventDefault();
      var btn = document.querySelector('.login button[type=submit]'); btn.disabled = true; err.textContent = 'Verificando…';
      var user = document.getElementById('lgUser').value, pw = document.getElementById('lgPass').value, found = null;
      for (var i = 0; i < USERS.length && !found; i++) {
        try { var kb = await deriveKey(USERS[i], user, pw); found = { mf: await openManifest(USERS[i], kb), n: i, k: toHex(kb) }; } catch (e) { }
      }
      if (found) { startSession(found.mf, found.n, found.k); return; }
      err.textContent = 'Usuario o contraseña incorrectos.';
      await new Promise(function (r) { setTimeout(r, 800); });
      btn.disabled = false; document.getElementById('lgPass').value = ''; document.getElementById('lgPass').focus();
    });
  }
  logout.addEventListener('click', function () { clearSession(); showLogin(); });
  (async function () {
    var s = null; try { s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { }
    if (s && USERS[s.n] && s.t && Date.now() - s.t < TTL) {
      try { startSession(await openManifest(USERS[s.n], fromHex(s.k)), s.n, s.k); return; } catch (e) { clearSession(); }
    }
    if (s) clearSession();
    showLogin();
  })();
})();
</script>

</body></html>
